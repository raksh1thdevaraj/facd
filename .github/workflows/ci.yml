name: Continuous Integration & Deployment Quality Gate

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Static Analysis, Formatting & Linters
  # ----------------------------------------------------------------------------
  lint-and-quality:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Linters
        run: pip install ruff

      - name: Run Ruff Code Inspection
        run: ruff check .

      - name: Run Ruff Formatting Verification
        run: ruff format --check .

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Frontend Lint
        working-directory: frontend
        run: npm run lint

  # ----------------------------------------------------------------------------
  # Job 2: Backend Automated Tests & Coverage Gate (>= 80%)
  # ----------------------------------------------------------------------------
  backend-tests:
    name: Backend Pytest & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install System Runtimes (Poppler, OpenCV dependencies)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils libgl1 libglib2.0-0 libgomp1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Requirements Traceability Audit
        working-directory: backend
        run: python scripts/verify_traceability.py

      - name: Run Pytest Test Suite with Coverage
        working-directory: backend
        env:
          ENVIRONMENT: testing
          SECRET_KEY: test-secret-key-32-characters-minimum-length-strictly-enforced
        run: |
          pytest --cov=app --cov-report=term-missing --cov-report=xml tests/ -v

  # ----------------------------------------------------------------------------
  # Job 3: Frontend Production Bundle Build
  # ----------------------------------------------------------------------------
  frontend-build:
    name: Frontend Compilation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Compile Production Bundle
        working-directory: frontend
        run: npm run build

      - name: Run Frontend Component Tests
        working-directory: frontend
        run: npm run test

  # ----------------------------------------------------------------------------
  # Job 4: Docker Configuration & Container Build Verification
  # ----------------------------------------------------------------------------
  docker-build-test:
    name: Docker Builds & Compose Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: certcheck-backend:ci-test

      - name: Test Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: certcheck-frontend:ci-test

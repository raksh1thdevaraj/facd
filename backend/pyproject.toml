[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-certificate-verification-backend"
version = "0.1.0"
description = "AI-Based Detection of Fake or Manipulated Academic Certificates - Backend API & Verification Pipeline"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Certificate Verification Engineering Team" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.1",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.1",
    "pillow>=10.2.0",
    "numpy>=1.26.4",
    "scipy>=1.12.0",
    "opencv-python-headless>=4.9.0.80",
    "scikit-image>=0.22.0",
    "scikit-learn>=1.4.1.post1",
    "pandas>=2.2.1",
    "reportlab>=4.1.0",
    "httpx>=0.27.0",
    "pytest>=8.0.2",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=4.1.0",
    "pypdf>=4.1.0",
    "pdf2image>=1.17.0",
    "pypdfium2>=4.30.0",
    "rapidfuzz>=3.8.0",
    "easyocr>=1.7.0",
    "pytesseract>=0.3.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = [".", ".."]
asyncio_mode = "auto"
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["B008"]

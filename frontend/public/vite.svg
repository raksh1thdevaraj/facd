<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#070c18" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#10b981" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Background Subtle Tech Accent -->
  <rect x="3" y="3" width="58" height="58" rx="15" fill="none" stroke="url(#shieldGrad)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Academic Graduation Cap (Mortarboard) -->
  <g filter="url(#glow)">
    <!-- Cap Top Diamond -->
    <polygon points="32,10 52,19 32,28 12,19" fill="url(#shieldGrad)" />
    
    <!-- Cap Skullcap Underneath -->
    <path d="M20,23.5 L20,30 C20,34.5 44,34.5 44,30 L44,23.5" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" />
    
    <!-- Tassel Ribbon & Bob -->
    <path d="M47,21.5 L51,28 L51,34" fill="none" stroke="#fcd34d" stroke-width="1.8" stroke-linecap="round" />
    <circle cx="51" cy="35" r="1.5" fill="#fcd34d" />
  </g>

  <!-- Certificate / Shield of Verification -->
  <g transform="translate(14, 25)">
    <!-- Shield Outline Body -->
    <path d="M18,3 C27,3 34,7 34,13 C34,25 24,32 18,34 C12,32 2,25 2,13 C2,7 9,3 18,3 Z" 
          fill="#0f172a" 
          stroke="url(#shieldGrad)" 
          stroke-width="2.5" 
          stroke-linejoin="round" />
    
    <!-- Evidentiary Verification Checkmark -->
    <path d="M11,18 L16,23 L26,12" 
          fill="none" 
          stroke="#10b981" 
          stroke-width="3" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>

  <!-- Academic Seal Ribbons at Bottom-Right of Shield -->
  <circle cx="44" cy="46" r="3" fill="#f59e0b" />
</svg>
